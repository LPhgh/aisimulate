# Pure-AFD saturation-point prediction (phase=both, concurrency beyond the
# pool's in-flight upper bound).
#
# Topology and backend_version are identical to afd-predict-pure.yaml; only the
# load is pushed past the admission bound: max_num_seqs = n_a_workers (1*8/8) *
# a_batch_size (18) = 18, while concurrency=24 > 18, so every pass has requests
# queued in the waiting queue.
#
# Purpose: anchor the "saturated side" admission and retract behavior - the 1.25
# headroom on num_gpu_blocks must keep the radix memory gate from truncating
# below max_num_seqs (G1), and every prompt must complete its prefill within a
# single pass (G2), never triggering retract across the run. The unsaturated
# side is covered by afd-predict-pure.yaml; the two cases together pin both
# sides of the admission boundary.

traffic:
  source: {type: synthetic, input_tokens: 1024, output_tokens: 128}
  load:   {type: concurrency, concurrency: 24}
  stop:   {requests: 64}

engine:
  mode: afd
  model: Qwen/Qwen3-32B
  hardware: h200_sxm          # node width 8
  backend: sglang
  backend_version: "0.5.14"
  context_length: max
  afd:
    phase: both               # pure AFD must be both
    combined_with_pd: false   # no companion
    n_a_nodes: 1              # A pool (attention) node count
    n_f_nodes: 1              # F pool (FFN/MoE) node count
    tp_a: 8                   # TP of the A worker; must divide gpus_per_node
    a_batch_size: 18         # per-A-worker batch
    num_microbatches: 3
    pipeline_model: full_overlap

evaluation:
  sla: {ttft_ms: 800, itl_ms: 30}
